[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memsearch-mini"
version = "0.1.1"
description = "Persistent memory for Claude Code and Codex: markdown journals indexed in a local SQLite database"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
    "tomli_w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.17,<1.24; python_version == '3.10'",
    "onnxruntime>=1.17; python_version >= '3.11'",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
]
openai = ["openai>=1.0"]
google = ["google-genai>=1.0"]
voyage = ["voyageai>=0.3"]
jina = ["httpx>=0.27"]
mistral = ["mistralai>=1.0"]
ollama = ["ollama>=0.4"]
local = ["einops>=0.8.2", "sentence-transformers>=3.0"]
all = ["memsearch-mini[onnx,openai,google,voyage,jina,mistral,ollama,local]"]

[project.scripts]
memsearch-mini = "memsearch_mini.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/memsearch_mini"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PGH", "RUF", "T20", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["memsearch_mini"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
